name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            platform: wasm
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install wasm-pack (WASM Only)
        if: matrix.platform == 'wasm'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WebAssembly Target
        if: matrix.platform == 'wasm'
        run: wasm-pack build --target web --out-dir pkg

      - name: Build Linux Target
        if: matrix.platform == 'linux'
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build Windows Target
        if: matrix.platform == 'windows'
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--exclude-all-symbols"
        run: cargo build --target ${{ matrix.target }} --release

      - name: Stage Public Static Folder (WASM Only)
        if: matrix.platform == 'wasm'
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f index.html ]; then
            echo "ERROR: index.html missing from repository root!"
            exit 1
          fi
          cp index.html dist/
          cp -r pkg dist/
          touch dist/.nojekyll

      - name: Upload Pages Artifact (WASM Only)
        if: matrix.platform == 'wasm'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/uses: actions/deploy-pages@v4
