name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux Target
        run: cargo build --target x86_64-unknown-linux-gnu --release

      - name: Package Linux Binary
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../diffusion-linux-x86_64.tar.gz diffusion

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-linux
          path: diffusion-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows Target
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--exclude-all-symbols"
        run: cargo build --target x86_64-pc-windows-gnu --release

      - name: Package Windows Binary
        run: |
          cd target/x86_64-pc-windows-gnu/release
          7z a ../../../diffusion-windows-x86_64.zip diffusion.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-windows
          path: diffusion-windows-x86_64.zip

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WebAssembly Target
        run: wasm-pack build --target web --out-dir pkg

      - name: Stage Public Static Folder
        run: |
          mkdir -p dist
          if [ ! -f index.html ]; then
            echo "ERROR: index.html missing from repository root!"
            exit 1
          fi
          cp index.html dist/
          cp -r pkg dist/
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Asset
        uses: actions/download-artifact@v4
        with:
          name: release-artifact-linux

      - name: Download Windows Asset
        uses: actions/download-artifact@v4
        with:
          name: release-artifact-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            diffusion-linux-x86_64.tar.gz
            diffusion-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
