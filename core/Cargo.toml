[package]
name = "core"
version = "2.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
pollster = "0.4.0"
bytemuck = "1.25.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Performance"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.64"
wgpu = { version = "27.0.1", features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "27.0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
