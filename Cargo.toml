[package]
name = "diffusion"
version = "2.1.0"
edition = "2024"

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.103"
bytemuck = "1.25.0"
env_logger = "0.10"
log = "0.4"
pollster = "0.4.0"
wgpu = "30.0"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}
wgpu = { version = "30.0", features = ["webgl"]}
